composed_safety_controller:
  ros__parameters:
    # Always validate in shadow mode before allowing this node to publish /drive.
    shadow_mode: true
    start_enabled: false
    control_rate_hz: 33.333333
    max_input_age_sec: 0.15
    max_control_latency_sec: 0.05
    # Commission at 0.5 m/s. Increase only after shadow/bag validation; the
    # exported controller is trained up to 3.0 m/s.
    max_command_speed_mps: 0.5
    torch_device: cpu
    inject_virtual_opponent_into_scan: true

    # The learned model used a half-size 0.29 x 0.155 m ego. These parameters
    # describe the actual chassis; LiDAR ranges are conservatively compensated
    # so the learned critic sees the same footprint-relative clearance.
    physical_vehicle_length_m: 0.58
    physical_vehicle_width_m: 0.31

    # Re-arm P2 whenever the same centerline opponent is encountered again.
    repeated_overtaking: true
    encounter_entry_distance_m: 1.0
    minimum_forward_gap_m: 0.05

    # False aligns the first /odom pose with map_start_pose. For multi-lap runs,
    # supply localized map-frame Odometry and set this to true.
    ego_pose_is_map_frame: false
    map_start_pose: [1.9251087, 1.3102571, -1.5716521]

    # Must match the static base_link -> laser transform in bringup_launch.py.
    laser_x: 0.27
    laser_y: 0.0
    laser_yaw: 0.0
    mppi_seed: 7
    # Matches vesc.yaml and must be replaced with the measured axle distance.
    mppi_wheelbase_m: 0.25

    scan_topic: /scan
    ego_odom_topic: /odom
    opponent_odom_topic: /virtual_opponent/odom
    enable_topic: /autonomy/enable
    drive_topic: /drive
    shadow_drive_topic: /safety_controller/shadow_drive
    status_topic: /safety_controller/status

virtual_opponent:
  ros__parameters:
    odom_topic: /virtual_opponent/odom
    marker_topic: /virtual_opponent/marker
    map_frame: map
    child_frame: virtual_opponent
    publish_rate_hz: 40.0
    speed_mps: 1.5
    # This publisher is open-loop: progress depends only on elapsed time and
    # speed_mps. It does not subscribe to ego pose, scan, or drive commands.
    initial_progress_m: 0.75
    vehicle_length: 0.29
    vehicle_width: 0.155
    enabled: true
